<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #101014; }
  body {
    display: grid; place-items: center; position: relative;
    background:
      radial-gradient(60% 60% at 50% 34%, rgba(214, 218, 228, 0.16), transparent 68%),
      #101014;
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 12.5% 12.5%;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000, transparent 78%);
  }
  img { position: relative; z-index: 1; width: 72%; height: 72%; }
</style>
</head>
<body><img src="logo-mark.svg" alt="" /></body>
</html>
