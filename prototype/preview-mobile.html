<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Archifex mobile preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0f; display: grid; place-items: center; }
    iframe { width: 390px; height: 844px; border: 0; border-radius: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.6); background: #17171c; }
  </style>
</head>
<body>
  <iframe id="frame" src="./index.html" title="Archifex mobile preview"></iframe>
  <script>
    const incoming = new URLSearchParams(location.search);
    const out = new URLSearchParams();
    ['demo', 'theme', 'lang', 'sector', 'doc'].forEach((key) => {
      if (incoming.has(key)) out.set(key, incoming.get(key));
    });
    const qs = out.toString();
    if (qs) document.getElementById('frame').src = `./index.html?${qs}`;
  </script>
</body>
</html>
